name: Publish Earl Phantomhive Maker
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - name: Prepare game files
        run: |
          python3 current/build.py site
          npm ci --prefix tools/content-editor
          node tools/content-editor/build-web.mjs site
          node tools/content-editor/placement-check.mjs
          node tools/content-editor/standing-check.mjs
          for script in site/js/*.js; do node --check "$script"; done
          node story-commerce.cjs site
      - name: Check animation and portrait interaction in Chromium and Firefox
        env:
          NODE_PATH: ${{ runner.temp }}/browser-qa/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-qa" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/browser-qa/node_modules/.bin/playwright" install --with-deps chromium firefox
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/game-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html -o /dev/null && break; sleep 1; done
          node lessons-and-portraits.cjs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow the Pages artifact to become available
        run: sleep 45
      - id: deployment
        uses: actions/deploy-pages@v4
